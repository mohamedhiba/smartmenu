name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # eslint 9 does not support Node 23. Stay on an LTS.
          node-version: 22
          cache: npm
      - run: npm ci
      # Next 16 generates the route types (LayoutProps, PageProps) that tsc
      # needs. On a clean checkout they do not exist yet.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          # The build must never need a real key.
          DEMO_MODE: "1"
